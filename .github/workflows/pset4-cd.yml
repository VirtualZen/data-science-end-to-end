# PSet 4 - Entrega continua de la imagen de la API.
# Al integrar en master (merge de un PR) cambios de psets/pset-04/: vuelve a correr las pruebas,
# construye la imagen y la publica en GHCR con el hash del commit como etiqueta (y "latest").
# docker-compose.yml usa esa imagen con API_TAG=<hash>; el modelo NO va dentro de la imagen
# (se resuelve del registro de MLflow por alias), asi que un cambio de champion no necesita CD.
name: pset4-cd

on:
  push:
    branches: [master]
    paths: ["psets/pset-04/**", ".github/workflows/pset4-cd.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psets/pset-04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: psets/pset-04/api/uv.lock

      - name: Pruebas antes de publicar
        run: |
          uv sync --project api --frozen
          uv run --project api --frozen pytest tests -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar ghcr.io/<duenio>/pset4-api:<hash>
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pset4-api"
          docker build -f api/Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$imagen:${GITHUB_SHA::7}" -t "$imagen:latest" .
          docker push "$imagen:${GITHUB_SHA::7}"
          docker push "$imagen:latest"
          echo "Publicada $imagen:${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
