version: 2
models:
- name: brz_precios_diarios
  description: Precios tipados, una fila por ticker y fecha (carga mas reciente).
  data_tests:
  - combinacion_unica:
      arguments:
        columnas:
        - ticker
        - fecha
  columns:
  - name: ticker
    data_tests:
    - not_null
  - name: fecha
    data_tests:
    - not_null
- name: brz_composicion_sp500
  description: Composicion del S&P 500 por foto, una empresa por fila (ticker = simbolo actual de Yahoo).
  data_tests:
  - combinacion_unica:
      arguments:
        columnas:
        - fecha_foto
        - ticker
  columns:
  - name: fecha_foto
    data_tests:
    - not_null
  - name: ticker
    data_tests:
    - not_null
- name: brz_listados_bolsa
  description: Simbolos listados actualmente y su bolsa.
  columns:
  - name: ticker
    data_tests:
    - not_null
    - unique
  - name: codigo_bolsa
    data_tests:
    - accepted_values:
        arguments:
          values:
          - N
          - A
          - Q
          - P
          - Z
          - V
seeds:
- name: calendario_nyse
  description: Dias en que abre la NYSE (pandas_market_calendars). Lo genera scripts/generar_calendario_nyse.py.
  columns:
  - name: fecha
    data_tests:
    - not_null
    - unique
- name: equivalencias_tickers
  description: Simbolo antiguo -> simbolo actual de Yahoo, valido hasta la fecha del cambio. Lo genera analisis/equivalencias_tickers.py.
  columns:
  - name: ticker_antiguo
    data_tests:
    - not_null
  - name: ticker_yahoo
    data_tests:
    - not_null
  - name: valido_hasta
    data_tests:
    - not_null
  - name: estado
    data_tests:
    - accepted_values:
        arguments:
          values:
          - verificado
          - detectado
          - manual
